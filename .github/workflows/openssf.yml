name: OpenSSF

on:
  workflow_dispatch:
  branch_protection_rule:
  push:
    branches: [main, '+.x', beta, alpha]
  schedule:
    - cron: '24 3 * * *' # At 03:24 every day

permissions: read-all

jobs:
  scorecard-secure-supply-chain-analysis:
    name: Scorecard - Secure supply-chain analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      security-events: write # Required to upload found security gaps
      id-token: write # Required to publish results and get a badge

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.github.com:443
            api.osv.dev:443
            www.bestpractices.dev:443
            api.securityscorecards.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            *.sigstore.dev:443
            api.deps.dev:443
            api.scorecard.dev:443

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Perform Scorecard Analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub's code scanning dashboard
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          sarif_file: results.sarif
